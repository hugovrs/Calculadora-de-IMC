<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Calculadora de IMC</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    
        <div class="caixa">
            <h2>Calculadora de IMC</h2>
            
            <label for="peso">Peso (kg):</label>
            <input id="peso" type="number" placeholder="Ex: 70">
            
            <label for="altura">Altura (m):</label>
            <input id="altura" type="number" placeholder="Ex: 1.75">
            
            <button onclick="calcular()">Calcular</button>
            
            <p id="resultado"></p>
            <br />
            <b>Aviso:</b> Coloque o ponto na <b>ALTURA</b>
            <br />
            <div class="assin">
                Feito por Hugo Veras
                <br>
                <a href="https://github.com/hugovrs">
                    <img id="github" src="assets/img/github-icon.png"/>
                </a>
            </div>
        </div>
        <script src="main.js"></script>
    
    </body>
</html>
